name: build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch of the source repo
        default: ios-w-core
      app:
        description: also build the Swift app (true/false)
        default: 'true'

jobs:
  kmp:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bosmandikmen-dotcom/Emresapp-srr-capture-lab
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: kmp-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: kmp-${{ runner.os }}-
      - name: Compile shared modules for iOS and run simulator tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --continue -q \
            :deadline-core:iosSimulatorArm64Test \
            :strings-core:compileKotlinIosArm64 \
            :vrc-core:compileKotlinIosArm64 \
            :visualgeo-core:compileKotlinIosArm64 \
            :routing-core:compileKotlinIosArm64 \
            :mappin-core:compileKotlinIosArm64 \
            :data-core:compileKotlinIosArm64 \
            :core:compileKotlinIosArm64 \
            :ui-shared:compileKotlinIosArm64 \
            :core:iosSimulatorArm64Test \
            :shared:assembleEmresSharedXCFramework 2>&1 | grep -E "^e: |^w: .*expect|FAILED|BUILD|What went wrong|> Task .* FAILED|Tests? .*(failed|passed)" | sed -E 's#file:///Users/runner/work/[^/]+/[^/]+/##' | head -400
          test ${PIPESTATUS[0]} -eq 0

  app:
    if: inputs.app == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DERIVED: ${{ github.workspace }}/iosApp/build/DerivedData
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bosmandikmen-dotcom/Emresapp-srr-capture-lab
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: kmp-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: kmp-${{ runner.os }}-
      - name: Build EmresShared.xcframework
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -q :shared:assembleEmresSharedXCFramework 2>&1 | grep -E "^e: |FAILED|What went wrong" | head -200
          test ${PIPESTATUS[0]} -eq 0
      - name: Generate the Xcode project
        working-directory: iosApp
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: CocoaPods
        working-directory: iosApp
        run: |
          if [ -f Podfile ]; then
            command -v pod >/dev/null || brew install cocoapods
            pod install
          fi
      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))][0].udid')
          test -n "$UDID" && test "$UDID" != null
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Build and test (simulator)
        working-directory: iosApp
        run: |
          if [ -d EmresApp.xcworkspace ]; then CONTAINER="-workspace EmresApp.xcworkspace"; else CONTAINER="-project EmresApp.xcodeproj"; fi
          xcodebuild test $CONTAINER -scheme EmresApp \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO -quiet 2>&1 | grep -E "error:|warning: .*deprecated|Test Suite|Executed|BUILD" | head -300
          test ${PIPESTATUS[0]} -eq 0
      - name: Build for device (unsigned)
        working-directory: iosApp
        run: |
          if [ -d EmresApp.xcworkspace ]; then CONTAINER="-workspace EmresApp.xcworkspace"; else CONTAINER="-project EmresApp.xcodeproj"; fi
          xcodebuild build $CONTAINER -scheme EmresApp -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO -quiet 2>&1 | grep -E "error:|BUILD" | head -200
          test ${PIPESTATUS[0]} -eq 0
